name: newdev-CD

on:
  push:
    branches:
      - newTest

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # or the version you're using
      - name: Install Dependencies
        run: npm install
      - name: Build for Development
        run: npm run build:dev
        
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_MUD_0F2BE680F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
        env:
          VITE_ORIGIN_URL: "https://gentle-mud-0f2be680f.5.azurestaticapps.net"
          VITE_API_URL: "https://api.jjmedia.appwrk.com/api/"
          VITE_CALLBACK_URL: "https://gentle-mud-0f2be680f.5.azurestaticapps.net/brands/connect"
          VITE_POST_IMG_BASE_PATH: "https://onquemediastorage.blob.core.windows.net/onquemedia/"
          ###### End of Repository/Build Configurations ######
